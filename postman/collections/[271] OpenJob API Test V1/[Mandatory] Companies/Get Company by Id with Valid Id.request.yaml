$kind: http-request
url: http://localhost:{{port}}/companies/{{companyId}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('it should response 200 status code', () => {
          pm.expect(pm.response).to.have.status(200);
      });

      pm.test('response body should have correct property and value', () => {
          const responseJson = pm.response.json();
          const companyId = pm.environment.get('companyId');
          pm.expect(responseJson.status).to.equal('success');
          pm.expect(responseJson.data.id).to.equal(companyId);
          pm.expect(responseJson.data.name).to.equal('Tech Corp Indonesia');
      });
    language: text/javascript
order: 9000
