$kind: http-request
url: http://localhost:{{port}}/companies/xxx
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
        "name": "Updated Company",
        "location": "Bandung"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('it should response 404 status code', () => {
          pm.expect(pm.response).to.have.status(404);
      });
    language: text/javascript
order: 10000
