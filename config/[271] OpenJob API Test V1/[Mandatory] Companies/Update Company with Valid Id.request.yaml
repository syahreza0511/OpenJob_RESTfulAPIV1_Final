$kind: http-request
url: http://localhost:{{port}}/companies/{{companyId}}
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
        "name": "Tech Corp Indonesia Updated",
        "location": "Bandung",
        "description": "Updated description"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('it should response 200 status code', () => {
          pm.expect(pm.response).to.have.status(200);
      });

      pm.test('response body should have correct property and value', () => {
          const responseJson = pm.response.json();
          pm.expect(responseJson.status).to.equal('success');
          pm.expect(responseJson.message).to.be.a('string');
      });
    language: text/javascript
order: 11000
