$kind: http-request
url: http://localhost:{{port}}/jobs/{{jobId}}
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
        "company_id": "{{jobCompanyId}}",
        "category_id": "{{jobCategoryId}}",
        "title": "Senior Backend Developer",
        "description": "We are looking for experienced backend developer",
        "job_type": "full-time",
        "experience_level": "senior",
        "location_type": "remote",
        "location_city": "Jakarta",
        "salary_min": 15000000,
        "salary_max": 25000000,
        "is_salary_visible": true,
        "status": "close"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('it should response 200 status code', () => {
          pm.expect(pm.response).to.have.status(200);
      });
    language: text/javascript
order: 20000
